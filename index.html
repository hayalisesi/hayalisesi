<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAYALİ SESİ | Resmi Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fauna+One&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #b38b1d; --bg: #fdfbf7; --text: #2c2416; }
        body { background: var(--bg); color: var(--text); font-family: 'Fauna One', serif; overflow-x: hidden; }
        .light-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #ffffff 0%, #f7f1e6 100%); z-index: -2; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(179, 139, 29, 0.15); border-radius: 30px; transition: 0.4s; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
        .hayali-mühür { width: 100px; height: 100px; background: url('kapak_logo.jpg'); background-size: cover; background-position: center; margin: 0 auto 15px auto; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 5px 20px rgba(179, 139, 29, 0.2); }
        .video-gallery { display: flex; gap: 20px; overflow-x: auto; padding: 20px 10px; scroll-behavior: smooth; }
        .video-item { flex: 0 0 180px; border-radius: 15px; overflow: hidden; border: 1px solid rgba(179, 139, 29, 0.1); cursor: pointer; transition: 0.4s; background: #fff; }
        .video-item:hover { transform: translateY(-5px); border-color: var(--gold); }
        .video-item img { width: 100%; height: 100px; object-fit: cover; }
        .video-title { padding: 10px; font-size: 9px; text-align: center; font-family: 'Cinzel'; text-transform: uppercase; color: var(--text); font-weight: bold; }
        .player-wrapper { max-width: 560px; margin: 0 auto; }
        .nav-btn { transition: 0.3s; border: 1.5px solid var(--gold); border-radius: 50px; font-size: 10px; letter-spacing: 2px; padding: 10px 20px; font-weight: bold; color: var(--gold); }
        .nav-btn:hover { background: var(--gold); color: white; }
        .gunun-sozu { max-width: 600px; margin: 0 auto 30px auto; padding: 20px; border-left: 2px solid var(--gold); border-right: 2px solid var(--gold); background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <div class="light-bg"></div>
    <header class="pt-10 pb-6 text-center px-4">
        <div class="hayali-mühür"></div>
        <h1 class="text-3xl font-bold tracking-[0.2em] mb-2" style="font-family: 'Cinzel'; color: #1a140a;">HAYALİ SESİ</h1>
        <p class="text-[9px] tracking-[0.4em] uppercase opacity-50 mb-6 italic">@hayalisesi</p>

        <div class="gunun-sozu px-6 rounded-xl">
            <span class="text-[8px] tracking-[0.5em] uppercase opacity-40 block mb-2">- GÜNÜN MÜHRÜ -</span>
            <p class="text-[14px] italic text-[#3d321d]">"Bazen bir hayal, bin gerçeklikten daha fazla ses getirir kalpte."</p>
        </div>

        <div class="flex justify-center gap-4 mb-8">
            <a href="shorts.html" class="nav-btn uppercase shadow-sm">Shorts</a>
            <a href="sozler.html" class="nav-btn uppercase shadow-sm">Sözler</a>
        </div>

        <div class="flex justify-center gap-8 flex-wrap text-[10px] font-bold tracking-widest mb-8 text-[#5c4a24]">
            <a href="https://www.youtube.com/@hayalisesi" target="_blank">YouTube</a>
            <a href="https://www.instagram.com/hayalisesi" target="_blank">Instagram</a>
            <a href="https://www.tiktok.com/@hayalisesi" target="_blank">TikTok</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6">
        <div class="player-wrapper mb-10 text-center">
            <div class="glass-card p-4 shadow-xl">
                <div class="relative pb-[56.25%] h-0 rounded-2xl overflow-hidden border-2 border-white">
                    <iframe id="mainPlayer" class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/FL-Zobmon9g" frameborder="0" allowfullscreen></iframe>
                </div>
                <h2 id="nowPlayingTitle" class="mt-4 text-md tracking-widest uppercase font-bold text-[#1a140a]" style="font-family: 'Cinzel';">Canımın İçi</h2>
            </div>
        </div>
    </main>

    <footer class="text-center pb-12 opacity-50">
        <a href="mailto:hakigol@gmail.com" class="text-lg font-bold tracking-widest text-[#1a140a] hover:text-[#b38b1d] block mb-4">hakigol@gmail.com</a>
        <p class="text-[9px] tracking-widest uppercase font-bold text-[#1a140a]">© 2026 HAYALİ SESİ</p>
        <p class="text-[8px] italic mt-2">Gizlilik Bildirimi: Tüm haklar mühürlüdür.</p>
    </footer>
</body>
</html>
