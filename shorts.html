<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAYALİ SESİ | Shorts Galeri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fauna+One&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #030303; }
        body { background: var(--bg); color: var(--gold); font-family: 'Fauna One', serif; overflow-x: hidden; }
        .mist-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05) 0%, #000 85%); z-index: -2; }
        .shorts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 25px; }
        .short-card { position: relative; aspect-ratio: 9/16; border-radius: 20px; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.2); cursor: pointer; transition: 0.4s; background: #000; }
        .short-card:hover { transform: translateY(-10px); border-color: var(--gold); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2); }
        .short-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: 0.3s; }
        .short-card:hover img { opacity: 1; }
        .play-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 32px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="mist-bg"></div>
    
    <header class="pt-16 pb-12 text-center px-4">
        <h1 class="text-4xl font-bold tracking-[0.2em] mb-4" style="font-family: 'Cinzel';">KISA VİDEOLAR</h1>
        <div style="width: 50px; height: 1px; background: var(--gold); margin: 0 auto 20px auto; opacity: 0.5;"></div>
        <a href="index.html" class="text-[10px] tracking-[0.3em] uppercase opacity-60 hover:opacity-100 transition">
            <i class="fas fa-arrow-left mr-2"></i> Ana Sayfaya Dön
        </a>
    </header>

    <main class="max-w-6xl mx-auto px-6 pb-24">
        <div class="shorts-grid">
             <div class="short-card" onclick="openShort('qbN5Mu2cImE')">
                <img src="https://img.youtube.com/vi/qbN5Mu2cImE/0.jpg"><i class="fas fa-play play-overlay"></i>
            </div>
            <div class="short-card" onclick="openShort('GgufBiBomp4')">
                <img src="https://img.youtube.com/vi/GgufBiBomp4/0.jpg"><i class="fas fa-play play-overlay"></i>
            </div>
            <div class="short-card" onclick="openShort('Nawya_26FjA')">
                <img src="https://img.youtube.com/vi/Nawya_26FjA/0.jpg"><i class="fas fa-play play-overlay"></i>
            </div>
            <div class="short-card" onclick="openShort('plNyeq5w-10')">
                <img src="https://img.youtube.com/vi/plNyeq5w-10/0.jpg"><i class="fas fa-play play-overlay"></i>
            </div>
            <div class="short-card" onclick="openShort('l1BH_2PqRMs')">
                <img src="https://img.youtube.com/vi/l1BH_2PqRMs/0.jpg"><i class="fas fa-play play-overlay"></i>
            </div>
            <div class="short-card" onclick="openShort('p9ZsoqcsQbg')">
                <img src="https://img.youtube.com/vi/p9ZsoqcsQbg/0.jpg"><i class="fas fa-play play-overlay"></i>
            </div>
            <div class="short-card" onclick="openShort('sZhKvlYcAGQ')">
                <img src="https://img.youtube.com/vi/sZhKvlYcAGQ/0.jpg"><i class="fas fa-play play-overlay"></i>
            </div>
            <div class="short-card" onclick="openShort('V4uIWaXPrEI')">
                <img src="https://img.youtube.com/vi/V4uIWaXPrEI/0.jpg"><i class="fas fa-play play-overlay"></i>
            </div>
            <div class="short-card" onclick="openShort('C9Vvb2KlAL4')">
                <img src="https://img.youtube.com/vi/C9Vvb2KlAL4/0.jpg"><i class="fas fa-play play-overlay"></i>
            </div>
            <div class="short-card" onclick="openShort('M056rPNyBM8')">
                <img src="https://img.youtube.com/vi/M056rPNyBM8/0.jpg"><i class="fas fa-play play-overlay"></i>
            </div>
        </div>
    </main>

    <div id="videoModal" class="fixed inset-0 bg-black/95 hidden z-50 flex items-center justify-center p-4">
        <button onclick="closeShort()" class="absolute top-6 right-6 text-white text-4xl">&times;</button>
        <div class="w-full max-w-[360px] aspect-[9/16]">
            <iframe id="modalIframe" class="w-full h-full rounded-3xl border border-gold/30" src="" frameborder="0" allow="autoplay; fullscreen"></iframe>
        </div>
    </div>

    <script>
        function openShort(id) {
            document.getElementById('modalIframe').src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
            document.getElementById('videoModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closeShort() {
            document.getElementById('videoModal').classList.add('hidden');
            document.getElementById('modalIframe').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
